name: Verify Trace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Python syntax
        run: python -m compileall -q trace tests
      - name: Backend, HTTP, model contract and gold-source evaluation
        run: python -m unittest discover -s tests -v
      - name: Client validation and export tests
        run: node --test tests/client.test.mjs
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Whitespace checks
        run: git diff --check
